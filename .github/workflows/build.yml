name: Windows preview
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        runtime: [win-x64, win-arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Server tests
        run: npm --prefix server test
      - name: Test and package
        shell: pwsh
        run: ./scripts/publish.ps1 -Runtime ${{ matrix.runtime }}
      - uses: actions/upload-artifact@v4
        with:
          name: Sentinel-${{ matrix.runtime }}
          path: artifacts/Sentinel-*-${{ matrix.runtime }}.zip
          if-no-files-found: error
  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: Sentinel-*
          path: artifacts
          merge-multiple: true
      - name: Verify and package release
        run: python3 scripts/package-release.py "${GITHUB_REF_NAME#v}" --from-archives
      - name: Publish development preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" artifacts/Sentinel-"$release_version"-*.zip "artifacts/SHA256SUMS-v$release_version.txt" \
            --verify-tag --prerelease --title "Sentinel $GITHUB_REF_NAME" --notes-file "docs/RELEASE-$release_version.md"
