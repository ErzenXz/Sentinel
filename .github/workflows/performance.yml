name: Windows resource investigation
on:
  push:
    branches: [codex/windows-performance, codex/archive-efficiency]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  profile:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build native fixture profiler
        run: dotnet build tests/Sentinel.UiTests -c Release
      - name: Fresh default renderer
        run: dotnet run --project tests/Sentinel.UiTests -c Release --no-build -- --profile --render default --output artifacts/resource-profile/default-fresh
      - name: Fresh software renderer
        run: dotnet run --project tests/Sentinel.UiTests -c Release --no-build -- --profile --render software --output artifacts/resource-profile/software-fresh
      - name: Software renderer after full verification
        run: dotnet run --project tests/Sentinel.UiTests -c Release --no-build -- --profile --render software --after-verification --output artifacts/resource-profile/software-after-verification
      - name: Verification with background tiered compilation disabled for diagnosis only
        env:
          DOTNET_TieredCompilation: '0'
        run: dotnet run --project tests/Sentinel.UiTests -c Release --no-build -- --profile --render software --after-verification --output artifacts/resource-profile/software-without-tiered-compilation
      - name: Compare warmed core workloads with v0.10 on this runner
        shell: pwsh
        run: |
          git fetch --no-tags origin tag v0.10.0 --depth=1
          if ($LASTEXITCODE -ne 0) { throw 'Baseline fetch failed' }
          New-Item -ItemType Directory -Force artifacts/benchmark-baseline | Out-Null
          git archive --format=zip --output=artifacts/baseline-core.zip v0.10.0 src/Sentinel.Core Directory.Build.props server/seeds
          if ($LASTEXITCODE -ne 0) { throw 'Baseline archive failed' }
          Expand-Archive artifacts/baseline-core.zip artifacts/benchmark-baseline
          $baselineProject = (Resolve-Path artifacts/benchmark-baseline/src/Sentinel.Core/Sentinel.Core.csproj).Path
          dotnet run --project tests/Sentinel.Benchmarks -c Release "-p:CoreProject=$baselineProject" -- --files 2500 --iterations 5 --feed-indicators 10000 > artifacts/resource-profile/core-baseline.json
          if ($LASTEXITCODE -ne 0) { throw 'Baseline benchmark failed' }
          dotnet run --project tests/Sentinel.Benchmarks -c Release -- --files 2500 --iterations 5 --feed-indicators 10000 > artifacts/resource-profile/core-candidate.json
          if ($LASTEXITCODE -ne 0) { throw 'Candidate benchmark failed' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Windows-Resource-Profile
          path: artifacts/resource-profile
          if-no-files-found: error
